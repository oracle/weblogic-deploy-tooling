resources:
    ForeignJNDIProvider:
        provider:
            Properties:
                vendor.one.encrypted: '@@PROP:provider.secret@@'
                vendor.two.encrypted: 'second-marker'
                vendor.plain: '@@PROP:ordinary@@'
    JMSSystemResource:
        module:
            JmsResource:
                ForeignServer:
                    foreign:
                        JNDIProperty:
                            vendor.jms.encrypted:
                                Value: '@@PROP:jms.secret@@'
                            vendor.plain:
                                Value: '@@PROP:ordinary@@'
    MailSession:
        mail:
            Properties:
                mail.smtp.user: '@@PROP:mail.user@@'
                mail.smtp.password: '@@PROP:mail.password@@'
